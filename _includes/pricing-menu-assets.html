{% comment %} Styles + calculator for the /pricing and /wholesale menu. Included by pricing-menu.html. {% endcomment %}

<style>
/* =========================================================================
   eJukebox a-la-carte pricing menu  (scoped under .ejm)
   Sits on the site's dark theme: indigo #6366f1, teal #14b8a6, pink #ec4899
   ========================================================================= */
/* Variables live on :root, not .ejm - the video modal gets relocated to <body>
   at runtime (see script) and must still resolve them. */
:root {
  --ejm-ind:#6366f1; --ejm-ind-lt:#818cf8; --ejm-teal:#14b8a6; --ejm-cyan:#22d3ee;
  --ejm-pink:#ec4899; --ejm-amber:#f5a623; --ejm-red:#f87171; --ejm-green:#34d399;
  --ejm-card:#1a1a2e; --ejm-card-2:#20203a; --ejm-line:rgba(255,255,255,.09);
  --ejm-line-2:rgba(255,255,255,.16);
  --ejm-ink:#f1f5f9; --ejm-soft:#c3cad8; --ejm-mut:#8d97ab;
  --ejm-r:14px;
}
.ejm { color:var(--ejm-ink); font-size:16px; line-height:1.62; }
.ejm *,.ejm *::before,.ejm *::after { box-sizing:border-box; }

/* The layout fades in #main-content's children by animating an inline transform,
   and leaves `transform: translateY(0)` on them permanently. A transformed
   ancestor becomes the containing block for position:fixed descendants, so the
   video modal would size itself to this (8000px tall) wrapper instead of the
   viewport. The modal is also reparented to <body> in the script below, which is
   the actual guard; this rule removes the hazard at source and skips a pointless
   whole-page fade. (Verified: it is NOT needed for the sticky total bar - sticky
   is unaffected by an ancestor transform.) !important beats the inline style. */
#main-content > .ejm { opacity:1 !important; transform:none !important; }

/* The `hidden` attribute is toggled from JS on several of these. The UA's
   [hidden]{display:none} is a bare attribute selector, so any class rule setting
   display (flex, etc.) silently beats it - these panels must lose that fight. */
.ejm-complete-nudge[hidden], .ejm-solo-lock[hidden],
.ejm-itemised[hidden], .ejm-modal[hidden] { display:none !important; }
.ejm p { color:var(--ejm-soft); }
.ejm a { color:var(--ejm-cyan); }

/* ---- reset the theme's #main-content heading rules -------------------------
   The theme sets font-size/colour with !important and hangs a gradient bar off
   h1:before. Same !important + higher specificity, so these win inside .ejm. */
#main-content .ejm h1, #main-content .ejm h2,
#main-content .ejm h3, #main-content .ejm h4 {
  font-family:'Poppins',Inter,sans-serif !important;
  color:var(--ejm-ink) !important;
  margin-top:0 !important; padding-bottom:0 !important;
  border-bottom:0 !important; letter-spacing:normal;
}
#main-content .ejm h1::before, #main-content .ejm h2::before,
#main-content .ejm h3::before, #main-content .ejm h4::before {
  content:none !important; display:none !important;
}
#main-content .ejm h1 { font-size:clamp(28px,4.4vw,46px) !important; font-weight:800 !important;
  line-height:1.07; letter-spacing:-.02em; margin:0 0 14px !important; }
#main-content .ejm h2 { font-size:clamp(21px,2.6vw,27px) !important; font-weight:750 !important;
  letter-spacing:-.015em; margin:0 !important; }
#main-content .ejm h3 { font-size:16px !important; font-weight:700 !important; }
#main-content .ejm h4 { font-size:15px !important; font-weight:700 !important; margin:0 0 7px !important; }
#main-content .ejm .ejm-base-main h3 { font-size:clamp(19px,2.3vw,25px) !important; font-weight:800 !important;
  letter-spacing:-.02em; margin:0 0 11px !important; }
#main-content .ejm .ejm-close h3 { font-size:23px !important; font-weight:800 !important;
  color:#fff !important; margin:0 0 8px !important; }
#main-content .ejm .ejm-step { margin:38px 0 16px !important; }
#main-content .ejm .ejm-lic-head h4, #main-content .ejm .ejm-hw h4 { font-size:15.5px !important; }
#main-content .ejm li strong { color:inherit !important; }

/* ---- confidential banner ---- */
.ejm-confidential {
  display:flex; gap:14px; align-items:flex-start;
  background:linear-gradient(100deg, rgba(245,166,35,.16), rgba(236,72,153,.07));
  border:1px solid rgba(245,166,35,.42); border-left-width:4px;
  border-radius:var(--ejm-r); padding:16px 18px; margin:0 0 34px;
}
.ejm-conf-icon { flex:none; width:34px; height:34px; border-radius:9px; background:rgba(245,166,35,.18);
  color:var(--ejm-amber); display:flex; align-items:center; justify-content:center; font-size:15px; }
.ejm-conf-body { font-size:13.5px; line-height:1.6; color:#e6dcc9; }
.ejm-conf-body strong { color:var(--ejm-amber); }
.ejm-confidential-foot { margin:34px 0 0; }

/* ---- hero ---- */
.ejm-hero { margin:0 0 34px; }
.ejm-eyebrow { display:inline-flex; align-items:center; gap:9px; font-size:12px; font-weight:700;
  letter-spacing:.15em; text-transform:uppercase; color:var(--ejm-cyan); margin-bottom:14px; }
.ejm-eyebrow::before { content:""; width:26px; height:2px; background:var(--ejm-cyan); border-radius:2px; }
.ejm-hero h1 { font-size:clamp(28px,4.4vw,46px); line-height:1.07; letter-spacing:-.02em; font-weight:800; margin:0 0 14px; }
.ejm-grad { background:linear-gradient(120deg,var(--ejm-ind-lt),var(--ejm-cyan)); -webkit-background-clip:text;
  background-clip:text; -webkit-text-fill-color:transparent; }
.ejm-lede { font-size:17px; max-width:74ch; margin:0 0 20px; }
.ejm-hero-notes { display:flex; flex-wrap:wrap; gap:10px; }
.ejm-hero-notes span { font-size:12.5px; font-weight:600; color:var(--ejm-soft); background:var(--ejm-card);
  border:1px solid var(--ejm-line); border-radius:999px; padding:7px 13px; }
.ejm-hero-notes i { color:var(--ejm-teal); margin-right:6px; }

/* ---- how it works ---- */
.ejm-how { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:0 0 46px; }
.ejm-how-item { display:flex; gap:13px; background:var(--ejm-card); border:1px solid var(--ejm-line);
  border-radius:var(--ejm-r); padding:18px; }
.ejm-how-n { flex:none; width:30px; height:30px; border-radius:9px; background:rgba(99,102,241,.2);
  color:var(--ejm-ind-lt); font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; }
.ejm-how-item h4 { margin:0 0 5px; font-size:14.5px; font-weight:700; }
.ejm-how-item p { margin:0; font-size:13px; color:var(--ejm-mut); line-height:1.55; }

/* ---- sections ---- */
.ejm-section { margin:0 0 58px; }
.ejm-sec-head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:0 0 8px; }
.ejm-sec-head h2 { font-size:clamp(21px,2.6vw,27px); font-weight:750; letter-spacing:-.015em; margin:0; }
.ejm-tag { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:5px 10px; border-radius:999px; }
.ejm-tag-base { color:var(--ejm-ind-lt); background:rgba(99,102,241,.16); }
.ejm-tag-menu { color:var(--ejm-teal); background:rgba(20,184,166,.14); }
.ejm-tag-hw   { color:var(--ejm-mut);  background:rgba(255,255,255,.06); }
.ejm-tag-lic  { color:var(--ejm-amber);background:rgba(245,166,35,.14); }
.ejm-tag-cmp  { color:var(--ejm-pink); background:rgba(236,72,153,.14); }
.ejm-sec-note { font-size:14.5px; max-width:84ch; margin:0 0 24px; }

.ejm-step { display:flex; align-items:center; gap:11px; font-size:16px; font-weight:700; margin:38px 0 16px; }
.ejm-step span { font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ejm-cyan); background:rgba(34,211,238,.13); border:1px solid rgba(34,211,238,.3);
  padding:5px 9px; border-radius:6px; }
.ejm-step em { font-style:normal; font-weight:500; color:var(--ejm-mut); font-size:14px; }

/* Short plain-language instruction under each step. Aimed at people who aren't
   confident with computers - say what to click and what happens. */
.ejm-help { display:flex; gap:11px; align-items:flex-start; margin:0 0 18px !important;
  background:rgba(34,211,238,.07); border:1px solid rgba(34,211,238,.22);
  border-radius:11px; padding:13px 16px; font-size:13.5px; line-height:1.6;
  color:var(--ejm-soft) !important; max-width:86ch; }
.ejm-help i { flex:none; color:var(--ejm-cyan); font-size:14px; margin-top:3px; }
.ejm-help b { color:var(--ejm-ink); }

/* ---- base product ---- */
.ejm-base { display:grid; grid-template-columns:1.55fr 1fr; gap:20px; }
.ejm-base-main { background:linear-gradient(155deg, rgba(99,102,241,.16), var(--ejm-card) 62%);
  border:1px solid var(--ejm-line-2); border-radius:16px; padding:26px 28px; }
.ejm-base-main h3 { font-size:clamp(19px,2.3vw,25px); font-weight:800; letter-spacing:-.02em; margin:0 0 11px; }
.ejm-base-main > p { font-size:15px; margin:0 0 22px; max-width:70ch; }
.ejm-base-pillars { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.ejm-base-pillars > div { background:rgba(0,0,0,.24); border:1px solid var(--ejm-line); border-radius:11px; padding:15px; }
.ejm-base-pillars i { color:var(--ejm-teal); font-size:15px; }
.ejm-base-pillars b { display:block; font-size:13.5px; margin:8px 0 5px; }
.ejm-base-pillars span { display:block; font-size:12.5px; color:var(--ejm-mut); line-height:1.5; }
.ejm-base-video { display:flex; }
.ejm-video-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:9px; background:var(--ejm-card); border:1px dashed var(--ejm-line-2);
  border-radius:16px; padding:26px; min-height:230px; }
.ejm-video-placeholder i { font-size:26px; color:var(--ejm-mut); }
.ejm-video-placeholder b { font-size:14px; }
.ejm-video-placeholder span { font-size:12.5px; color:var(--ejm-mut); max-width:32ch; line-height:1.5; }

/* ---- tiers ---- */
.ejm-tiers { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.ejm-tier { position:relative; display:block; cursor:pointer; margin:0; }
.ejm-tier input { position:absolute; opacity:0; width:0; height:0; }
.ejm-tier-inner { display:flex; flex-direction:column; gap:11px; height:100%;
  background:var(--ejm-card); border:1.5px solid var(--ejm-line); border-radius:16px;
  padding:20px; transition:border-color .18s, background .18s, transform .18s; }
.ejm-tier:hover .ejm-tier-inner { border-color:var(--ejm-line-2); transform:translateY(-2px); }
.ejm-tier input:focus-visible + .ejm-tier-inner { outline:2px solid var(--ejm-cyan); outline-offset:2px; }
.ejm-tier input:checked + .ejm-tier-inner { border-color:var(--ejm-teal);
  background:linear-gradient(160deg, rgba(20,184,166,.14), var(--ejm-card) 60%);
  box-shadow:0 0 0 1px rgba(20,184,166,.35), 0 10px 34px rgba(20,184,166,.14); }
.ejm-rec-flag { position:absolute; top:-9px; left:20px; z-index:2; font-size:10px; font-weight:800;
  letter-spacing:.08em; text-transform:uppercase; color:#0f0f1a; background:var(--ejm-cyan);
  padding:4px 9px; border-radius:5px; }
.ejm-tier-top { display:flex; align-items:center; gap:11px; }
.ejm-radio { flex:none; width:19px; height:19px; border-radius:50%; border:2px solid var(--ejm-line-2);
  position:relative; transition:border-color .18s; }
.ejm-tier input:checked + .ejm-tier-inner .ejm-radio { border-color:var(--ejm-teal); }
.ejm-tier input:checked + .ejm-tier-inner .ejm-radio::after { content:""; position:absolute; inset:3px;
  border-radius:50%; background:var(--ejm-teal); }
.ejm-tier-name { font-size:17px; font-weight:750; line-height:1.25; }
.ejm-tier-name em { display:block; font-style:normal; font-size:12px; font-weight:500; color:var(--ejm-mut); }
.ejm-tier-price { display:flex; align-items:baseline; gap:5px; }
.ejm-tier-price b { font-size:34px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.ejm-tier-price i { font-style:normal; font-size:12.5px; color:var(--ejm-mut); }
.ejm-tier-blurb { font-size:13px; color:var(--ejm-soft); line-height:1.55; }
.ejm-tier-points { display:flex; flex-direction:column; gap:6px; margin-top:auto; padding-top:11px;
  border-top:1px solid var(--ejm-line); }
.ejm-tier-points span { display:flex; gap:8px; font-size:12.5px; color:var(--ejm-mut); line-height:1.45; }
.ejm-tier-points i { color:var(--ejm-teal); font-size:10px; margin-top:5px; flex:none; }

/* wholesale strip */
.ejm-whl-line { display:flex; flex-wrap:wrap; gap:8px; font-size:11.5px; }
.ejm-whl-line > span { background:rgba(0,0,0,.3); border:1px solid var(--ejm-line); border-radius:6px;
  padding:5px 9px; color:var(--ejm-mut); }
.ejm-whl-line b { color:var(--ejm-ink); font-variant-numeric:tabular-nums; }
.ejm-whl-line .ejm-margin { border-color:rgba(52,211,153,.35); background:rgba(52,211,153,.1); color:#a7e9cf; }
.ejm-whl-line .ejm-margin b { color:var(--ejm-green); }
.ejm-whl-card { margin:0 0 12px; }

/* ---- nudge ---- */
.ejm-complete-nudge { display:flex; align-items:center; gap:13px; margin:16px 0 0;
  background:linear-gradient(100deg, rgba(34,211,238,.16), rgba(99,102,241,.08));
  border:1px solid rgba(34,211,238,.42); border-radius:12px; padding:14px 17px; font-size:13.5px; color:#d8f4fb; }
.ejm-complete-nudge > i { color:var(--ejm-cyan); font-size:16px; flex:none; }
.ejm-complete-nudge span { flex:1; }
.ejm-complete-nudge b { color:#fff; }
.ejm-nudge-btn { flex:none; background:var(--ejm-cyan); color:#0f0f1a; border:0; border-radius:8px;
  padding:9px 15px; font-weight:800; font-size:12.5px; cursor:pointer; font-family:inherit; }
.ejm-nudge-btn:hover { background:#67e8f9; }

.ejm-solo-lock { display:flex; align-items:center; gap:12px; margin:0 0 16px;
  background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.35); border-radius:12px;
  padding:13px 16px; font-size:13.5px; color:#e6dcc9; }
.ejm-solo-lock i { color:var(--ejm-amber); }
.ejm-solo-lock b { color:var(--ejm-amber); }

/* ---- feature cards ---- */
.ejm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(288px,1fr)); gap:15px; }
.ejm-card { display:flex; flex-direction:column; background:var(--ejm-card); border:1.5px solid var(--ejm-line);
  border-radius:var(--ejm-r); padding:17px 18px; margin:0; }
.ejm-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
.ejm-cat { font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ejm-mut);
  background:rgba(255,255,255,.05); border:1px solid var(--ejm-line); border-radius:5px; padding:4px 8px; }
.ejm-cat-bundle { color:var(--ejm-pink); background:rgba(236,72,153,.12); border-color:rgba(236,72,153,.3); }
.ejm-card h4 { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:700; margin:0 0 7px; line-height:1.3; }
.ejm-card p { font-size:13px; color:var(--ejm-mut); line-height:1.55; margin:0 0 13px; }
.ejm-card-foot { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:auto;
  padding-top:12px; border-top:1px solid var(--ejm-line); }

.ejm-card-incl { border-style:dashed; border-color:rgba(20,184,166,.3);
  background:linear-gradient(165deg, rgba(20,184,166,.06), var(--ejm-card) 70%); }
.ejm-price-incl { font-size:11.5px; font-weight:800; letter-spacing:.03em; color:var(--ejm-teal);
  background:rgba(20,184,166,.14); border:1px solid rgba(20,184,166,.35); border-radius:999px; padding:5px 10px; }

/* checkbox cards */
.ejm-card-addon { position:relative; cursor:pointer; transition:border-color .18s, background .18s, transform .18s; }
.ejm-card-addon:hover { border-color:var(--ejm-line-2); transform:translateY(-2px); }
.ejm-card-addon input { position:absolute; opacity:0; width:0; height:0; }
.ejm-tick { display:flex; align-items:center; gap:9px; margin:0; cursor:pointer; font:inherit; color:inherit; }
.ejm-check { flex:none; width:19px; height:19px; border-radius:5px; border:2px solid var(--ejm-line-2);
  position:relative; transition:all .18s; }
.ejm-check::after { content:"\f00c"; font-family:"Font Awesome 6 Free"; font-weight:900; font-size:10px;
  color:#0f0f1a; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .18s; }
.ejm-card-addon:has(input:checked) { border-color:var(--ejm-teal);
  background:linear-gradient(160deg, rgba(20,184,166,.13), var(--ejm-card) 62%);
  box-shadow:0 0 0 1px rgba(20,184,166,.32), 0 8px 28px rgba(20,184,166,.12); }
.ejm-card-addon:has(input:checked) .ejm-check { background:var(--ejm-teal); border-color:var(--ejm-teal); }
.ejm-card-addon:has(input:checked) .ejm-check::after { opacity:1; }
.ejm-card-addon:has(input:focus-visible) { outline:2px solid var(--ejm-cyan); outline-offset:2px; }
/* "Dimmed" means not-yet-available, NOT un-clickable: clicking one switches your
   base up, or turns its parent add-on on. So it keeps a pointer cursor - never
   `not-allowed`, which reads as "this is broken" on something that does respond.

   Dim the descriptive parts individually rather than putting opacity on the tile:
   opacity on a parent applies to every descendant and a child CANNOT opt back out,
   which would drag the Watch button down with it. Watching the video is how people
   understand the feature, so it has to stay fully lit in every state. */
.ejm-card-addon.is-locked { cursor:pointer; }
.ejm-card-addon.is-locked .ejm-card-head,
.ejm-card-addon.is-locked h4,
.ejm-card-addon.is-locked p,
.ejm-card-addon.is-locked .ejm-whl-card {
  opacity:.45; filter:saturate(.5); transition:opacity .18s, filter .18s;
}
.ejm-card-addon.is-locked:hover .ejm-card-head,
.ejm-card-addon.is-locked:hover h4,
.ejm-card-addon.is-locked:hover p,
.ejm-card-addon.is-locked:hover .ejm-whl-card { opacity:.9; filter:none; }
.ejm-card-addon.is-locked:hover { border-color:var(--ejm-line-2); }
/* never dimmed, never disabled, in any card state */
.ejm-card-addon.is-locked .ejm-card-foot,
.ejm-card-addon.is-locked .ejm-watch { opacity:1; filter:none; }
/* Complete: every add-on is already on, so there is genuinely nothing to click. */
.ejm-card-addon.is-forced { cursor:default; }
.ejm-card-addon.is-forced:hover { transform:none; border-color:var(--ejm-teal); }
.ejm-card-addon.is-forced .ejm-tick { cursor:default; }
.ejm-watch { cursor:pointer; }   /* watching a video never depends on tier/deps */

.ejm-price { display:flex; align-items:baseline; gap:3px; white-space:nowrap; }
.ejm-price b { font-size:20px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--ejm-ink); }
.ejm-price i { font-style:normal; font-size:11.5px; color:var(--ejm-mut); }
.ejm-price.is-free b { color:var(--ejm-teal); font-size:13px; font-weight:800; }
.ejm-price.is-bundled b { color:var(--ejm-pink); font-size:13px; font-weight:800; }

.ejm-watch { display:inline-flex; align-items:center; gap:7px; background:rgba(99,102,241,.16);
  color:var(--ejm-ind-lt); border:1px solid rgba(99,102,241,.42); border-radius:8px; padding:7px 13px;
  font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s; }
.ejm-watch:hover { background:var(--ejm-ind); color:#fff; border-color:var(--ejm-ind); }
.ejm-novideo { display:inline-flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ejm-mut);
  border:1px dashed var(--ejm-line-2); border-radius:8px; padding:7px 11px; }
/* Add / Added chip - the plain-language twin of the tick box */
.ejm-addstate { margin-left:auto; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  font-size:12.5px; font-weight:800; padding:7px 13px; border-radius:8px;
  border:1px dashed var(--ejm-line-2); color:var(--ejm-soft); background:rgba(255,255,255,.04);
  transition:background .15s, color .15s, border-color .15s; }
.ejm-card-addon:hover .ejm-addstate { border-color:var(--ejm-teal); color:var(--ejm-teal); }
.ejm-addstate.is-on { background:var(--ejm-teal); border-style:solid; border-color:var(--ejm-teal); color:#06231d; }
.ejm-card-addon:hover .ejm-addstate.is-on { background:#2dd4bf; border-color:#2dd4bf; color:#06231d; }
.ejm-addstate.is-fixed { background:rgba(20,184,166,.14); border-style:solid;
  border-color:rgba(20,184,166,.35); color:var(--ejm-teal); }
.ejm-reqs { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
.ejm-req { font-size:10.5px; font-weight:600; color:var(--ejm-mut); background:rgba(255,255,255,.04);
  border:1px solid var(--ejm-line); border-radius:5px; padding:4px 7px; white-space:nowrap; }
.ejm-req-hw { color:#f0c98a; border-color:rgba(245,166,35,.3); background:rgba(245,166,35,.08); }

/* ---- bundle + zones ---- */

<script>
(function () {
  var D = window.EJM_DATA;
  if (!D) return;
  var root = document.querySelector('.ejm');
  if (!root) return;

  var WHOLESALE = D.mode === 'wholesale';
  var byId = function (list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; };
  var cost = function (o) { return WHOLESALE ? o.whl : o.retail; };   // what the buyer of THIS page pays
  var rrp  = function (o) { return o.retail; };                        // recommended retail, for margin maths
  var money = function (n) { return '$' + n.toLocaleString('en-AU'); };

  var state = { tier: 'core', addons: {}, zones: D.zones.included };

  // ---- elements
  var tierRadios  = root.querySelectorAll('input[name="ejm-tier"]');
  var addonBoxes  = root.querySelectorAll('.ejm-addon-cb');
  var soloLock    = root.querySelector('#ejm-solo-lock');
  var inclNote    = root.querySelector('#ejm-incl-note');
  var nudge       = root.querySelector('#ejm-nudge');
  var nudgeText   = root.querySelector('#ejm-nudge-text');
  var nudgeBtn    = root.querySelector('#ejm-nudge-btn');
  var zoneCount   = root.querySelector('#ejm-zone-count');
  var zoneCost    = root.querySelector('#ejm-zone-cost');
  var zoneMinus   = root.querySelector('#ejm-zone-minus');
  var zonePlus    = root.querySelector('#ejm-zone-plus');
  var elAmount    = root.querySelector('#ejm-total-amount');
  var elRrp       = root.querySelector('#ejm-total-rrp');
  var elMargin    = root.querySelector('#ejm-total-margin');
  var elTierName  = root.querySelector('#ejm-total-tier');
  var elSummary   = root.querySelector('#ejm-total-summary');
  var elItemList  = root.querySelector('#ejm-itemised-list');
  var elItemised  = root.querySelector('#ejm-itemised');
  var elToggle    = root.querySelector('#ejm-total-toggle');
  var elCta       = root.querySelector('#ejm-total-cta');

  // ---- zone cost for a given zone count (returns [costPrice, rrpPrice])
  function zonePrices(n) {
    var extra = Math.max(0, n - D.zones.included);
    if (extra === 0) return [0, 0];
    if (n >= D.zones.cap_from) return [WHOLESALE ? D.zones.cap_whl : D.zones.cap_retail, D.zones.cap_retail];
    return [extra * (WHOLESALE ? D.zones.extra_whl : D.zones.extra_retail), extra * D.zones.extra_retail];
  }

  // ---- the whole calculation
  function calc() {
    var tier = byId(D.tiers, state.tier);
    var everything = !!tier.includes_all_addons;
    var noAddons   = !tier.allows_addons;

    // which add-ons are actually on
    var on = {};
    D.addons.forEach(function (a) {
      if (everything) { on[a.id] = true; }
      else if (noAddons) { on[a.id] = false; }
      else { on[a.id] = !!state.addons[a.id]; }
    });
    // a dependent add-on can't be on without its parent
    D.addons.forEach(function (a) {
      if (a.requires && on[a.id] && !on[a.requires]) on[a.id] = false;
    });

    var lines = [];
    lines.push({ label: tier.name + ' base', cost: cost(tier), rrp: rrp(tier) });

    var addonCost = 0, addonRrp = 0;

    if (everything) {
      // all add-ons folded into the tier price
      D.addons.forEach(function (a) { lines.push({ label: a.name, cost: 0, rrp: 0, free: 'In Complete' }); });
    } else {
      // bundle: every member on -> bundle price replaces the members' individual prices
      var bundledIds = {};
      D.bundles.forEach(function (b) {
        var all = b.members.every(function (m) { return on[m]; });
        if (!all) return;
        b.members.forEach(function (m) { bundledIds[m] = b.id; });
        addonCost += cost(b); addonRrp += rrp(b);
        lines.push({ label: b.name + ' bundle (' + b.members.length + ' voice add-ons)', cost: cost(b), rrp: rrp(b) });
      });
      D.addons.forEach(function (a) {
        if (!on[a.id]) return;
        if (bundledIds[a.id]) { lines.push({ label: a.name, cost: 0, rrp: 0, free: 'In bundle' }); return; }
        addonCost += cost(a); addonRrp += rrp(a);
        lines.push({ label: a.name, cost: cost(a), rrp: rrp(a) });
      });
    }

    var zp = zonePrices(state.zones);
    if (zp[0] > 0 || zp[1] > 0) {
      var extra = state.zones - D.zones.included;
      var zlabel = state.zones >= D.zones.cap_from
        ? state.zones + ' zones (unlimited-zone cap)'
        : extra + ' extra zone' + (extra === 1 ? '' : 's') + ' (' + state.zones + ' total)';
      lines.push({ label: zlabel, cost: zp[0], rrp: zp[1] });
    }

    return {
      tier: tier, on: on, lines: lines,
      addonCost: addonCost, addonRrp: addonRrp,
      zoneCost: zp[0], zoneRrp: zp[1],
      totalCost: cost(tier) + addonCost + zp[0],
      totalRrp:  rrp(tier)  + addonRrp  + zp[1],
      everything: everything, noAddons: noAddons
    };
  }

  // ---- paint
  function render() {
    var r = calc();

    // add-on cards
    D.addons.forEach(function (a) {
      var cb   = root.querySelector('#add-' + a.id);
      var card = root.querySelector('[data-addon="' + a.id + '"]');
      var pr   = root.querySelector('[data-price-for="' + a.id + '"]');
      if (!cb || !card || !pr) return;

      // Boolean() is load-bearing: `a.requires` is undefined on most add-ons, so
      // these expressions evaluate to undefined, and classList.toggle(name, undefined)
      // FLIPS the class instead of removing it - which made every card alternate
      // between dim and lit on each render.
      var parentOff = Boolean(a.requires && !r.on[a.requires]);
      var dimmed    = Boolean(!r.everything && (r.noAddons || parentOff));

      cb.checked  = !!r.on[a.id];
      // Only Complete truly disables a box (everything is already included). Solo and
      // an unmet dependency stay clickable and resolve themselves - see the change handler.
      cb.disabled = r.everything;
      card.classList.toggle('is-locked', dimmed);
      card.classList.toggle('is-forced', Boolean(r.everything));

      // price shown on the card
      var bundled = false;
      D.bundles.forEach(function (b) {
        if (b.members.indexOf(a.id) === -1) return;
        if (b.members.every(function (m) { return r.on[m]; })) bundled = true;
      });
      pr.classList.remove('is-free', 'is-bundled');
      if (r.everything)      { pr.classList.add('is-free');    pr.innerHTML = '<b>Included</b>'; }
      else if (bundled)      { pr.classList.add('is-bundled'); pr.innerHTML = '<b>In bundle</b>'; }
      else                   { pr.innerHTML = '<b>' + money(cost(a)) + '</b><i>/mo</i>'; }

      // Plain-language Add / Added chip. A bare tick box is easy to miss, and this
      // spells out what clicking the card will do.
      var chip = root.querySelector('[data-add-for="' + a.id + '"]');
      if (chip) {
        chip.classList.remove('is-on', 'is-fixed');
        if (r.everything)   { chip.classList.add('is-fixed'); chip.innerHTML = '<i class="fas fa-check"></i> Included'; }
        else if (r.on[a.id]){ chip.classList.add('is-on');    chip.innerHTML = '<i class="fas fa-check"></i> Added'; }
        else                { chip.innerHTML = '<i class="fas fa-plus"></i> Add'; }
      }
    });

    // bundle strips
    D.bundles.forEach(function (b) {
      var strip = root.querySelector('#ejm-bundle-' + b.id);
      var st    = root.querySelector('#ejm-bundle-state-' + b.id);
      var btn   = root.querySelector('#ejm-bundle-btn-' + b.id);
      if (!strip || !st || !btn) return;
      var applied = Boolean(!r.everything && b.members.every(function (m) { return r.on[m]; }));
      var saving = b.members.reduce(function (s, m) { return s + cost(byId(D.addons, m)); }, 0) - cost(b);
      strip.classList.toggle('is-on', applied);
      if (r.everything) {
        btn.hidden = true;
        st.className = 'ejm-bundle-state is-on';
        st.innerHTML = '<i class="fas fa-check"></i> Already included in Complete';
      } else if (applied) {
        btn.hidden = false;
        btn.className = 'ejm-bundle-btn is-remove';
        btn.innerHTML = '<i class="fas fa-xmark"></i> Remove the bundle';
        st.className = 'ejm-bundle-state is-on';
        st.innerHTML = '<i class="fas fa-check"></i> Added - saving you ' + money(saving) + '/mo';
      } else {
        btn.hidden = false;
        btn.className = 'ejm-bundle-btn';
        btn.innerHTML = '<i class="fas fa-plus"></i> Add all four for ' + money(cost(b)) + '/mo';
        st.className = 'ejm-bundle-state';
        st.innerHTML = 'Saves ' + money(saving) + '/mo compared with adding them one by one';
      }
    });

    if (soloLock) soloLock.hidden = !r.noAddons;
    if (inclNote) inclNote.textContent = 'in ' + r.tier.name;

    // zones
    zoneCount.textContent = state.zones;
    zoneMinus.disabled = state.zones <= 1;
    zonePlus.disabled  = state.zones >= 20;
    zoneCost.textContent = r.zoneCost === 0
      ? D.zones.included + ' included - $0/mo'
      : (state.zones >= D.zones.cap_from ? 'Unlimited-zone cap - ' : '') + '+' + money(r.zoneCost) + '/mo';

    // nudge: only worth showing on a tier that isn't already Complete
    var complete = byId(D.tiers, 'complete');
    if (nudge && complete && !r.everything && !r.noAddons) {
      var softwareNow = cost(r.tier) + r.addonCost;   // zones sit outside the Complete price
      var saving = softwareNow - cost(complete);
      if (saving > 0) {
        nudge.hidden = false;
        nudgeText.innerHTML = 'You’ve ticked <b>' + money(softwareNow) + '/mo</b> of base + add-ons. ' +
          '<b>Complete</b> gives you every software add-on for <b>' + money(cost(complete)) + '/mo</b> - ' +
          'you’d save <b>' + money(saving) + '/mo</b> and get the rest as well.';
      } else { nudge.hidden = true; }
    } else if (nudge) { nudge.hidden = true; }

    // totals
    elTierName.textContent = r.tier.name;
    var chosen = D.addons.filter(function (a) { return r.on[a.id]; }).length;
    elSummary.textContent = state.zones + ' zone' + (state.zones === 1 ? '' : 's') + ', ' +
      (r.everything ? 'every add-on included' : (chosen === 0 ? 'no add-ons' : chosen + ' add-on' + (chosen === 1 ? '' : 's')));

    elAmount.textContent = money(r.totalCost);
    if (WHOLESALE && elRrp && elMargin) {
      elRrp.textContent = money(r.totalRrp);
      elMargin.textContent = money(r.totalRrp - r.totalCost);
    }

    // itemised
    elItemList.innerHTML = '';
    r.lines.forEach(function (l) {
      var li = document.createElement('li');
      var name = document.createElement('span'); name.textContent = l.label;
      var val  = document.createElement('b');
      if (l.free) { val.textContent = l.free; li.className = 'is-free'; }
      else { val.textContent = money(l.cost) + '/mo'; }
      li.appendChild(name); li.appendChild(val); elItemList.appendChild(li);
    });
    var sum = document.createElement('li'); sum.className = 'is-sum';
    var sl = document.createElement('span');
    sl.textContent = WHOLESALE ? 'Your wholesale cost per month' : 'Total per month (ex GST)';
    var sv = document.createElement('b'); sv.textContent = money(r.totalCost) + '/mo';
    sum.appendChild(sl); sum.appendChild(sv); elItemList.appendChild(sum);
    if (WHOLESALE) {
      var m = document.createElement('li'); m.className = 'is-sum';
      var ml = document.createElement('span'); ml.textContent = 'Sell at ' + money(r.totalRrp) + '/mo → your margin';
      var mv = document.createElement('b'); mv.textContent = money(r.totalRrp - r.totalCost) + '/mo';
      mv.style.color = 'var(--ejm-green)';
      m.appendChild(ml); m.appendChild(mv); elItemList.appendChild(m);
    }

    // the CTA carries the build with it
    if (elCta) {
      var body = (WHOLESALE ? 'Wholesale package build\n\n' : 'My eJukebox package\n\n');
      r.lines.forEach(function (l) { body += '- ' + l.label + ': ' + (l.free ? l.free : money(l.cost) + '/mo') + '\n'; });
      body += '\n' + (WHOLESALE
        ? 'Wholesale cost: ' + money(r.totalCost) + '/mo\nRRP: ' + money(r.totalRrp) + '/mo\nMargin: ' + money(r.totalRrp - r.totalCost) + '/mo'
        : 'Total: ' + money(r.totalCost) + '/mo ex GST');
      body += '\n\n(Excludes one-off hardware/install and the OneMusic licence.)\n\nVenue:\nContact:\n';
      var subj = WHOLESALE ? 'Wholesale package build - ' + money(r.totalCost) + '/mo'
                           : 'eJukebox package - ' + money(r.totalCost) + '/mo';
      elCta.href = 'mailto:info@ejukebox.com.au?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
    }
  }

  // ---- events
  Array.prototype.forEach.call(tierRadios, function (rd) {
    rd.addEventListener('change', function () { if (rd.checked) { state.tier = rd.value; render(); } });
  });
  Array.prototype.forEach.call(addonBoxes, function (cb) {
    cb.addEventListener('change', function () {
      var a = byId(D.addons, cb.value);
      if (cb.checked) {
        // Ticking something the current base can't carry moves you up rather than
        // refusing the click.
        var t = byId(D.tiers, state.tier);
        if (t && !t.allows_addons) {
          state.tier = 'core';
          var rd = root.querySelector('#tier-core');
          if (rd) rd.checked = true;
        }
        // Ticking a dependant switches its parent on too (Monitor -> Live Mic).
        if (a && a.requires) state.addons[a.requires] = true;
      }
      state.addons[cb.value] = cb.checked;
      // turning a parent off takes its dependants with it
      if (!cb.checked) D.addons.forEach(function (x) { if (x.requires === cb.value) state.addons[x.id] = false; });
      render();
    });
    // the whole card is a hit target, but leave the <label> and Watch button to themselves
    var card = cb.closest('.ejm-card-addon');
    if (!card) return;
    card.addEventListener('click', function (e) {
      if (cb.disabled) return;
      if (e.target.closest('label') || e.target.closest('.ejm-watch')) return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change', { bubbles: true }));
    });
  });
  // Bundle button: one click adds or removes all of its members. Previously the
  // bundle only ever applied if you happened to tick all four individually, and the
  // strip just said "Not applied" with no way to act on it.
  D.bundles.forEach(function (b) {
    var btn = root.querySelector('#ejm-bundle-btn-' + b.id);
    if (!btn) return;
    btn.addEventListener('click', function () {
      var on = b.members.every(function (m) { return state.addons[m]; });
      var t = byId(D.tiers, state.tier);
      if (!on && t && !t.allows_addons) {        // adding from Solo moves you up to Core
        state.tier = 'core';
        var rd = root.querySelector('#tier-core');
        if (rd) rd.checked = true;
      }
      b.members.forEach(function (m) { state.addons[m] = !on; });
      render();
    });
  });

  zoneMinus.addEventListener('click', function () { if (state.zones > 1) { state.zones--; render(); } });
  zonePlus .addEventListener('click', function () { if (state.zones < 20) { state.zones++; render(); } });
  if (nudgeBtn) nudgeBtn.addEventListener('click', function () {
    var rd = root.querySelector('#tier-complete');
    if (rd) { rd.checked = true; state.tier = 'complete'; render(); rd.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  });
  elToggle.addEventListener('click', function () {
    var open = elItemised.hidden;
    elItemised.hidden = !open;
    elToggle.setAttribute('aria-expanded', String(open));
    elToggle.querySelector('span').textContent = open ? 'Hide breakdown' : 'Show breakdown';
  });

  // ---- video modal. Clips are 30-90MB, so nothing loads until Watch is pressed.
  var modal  = root.querySelector('#ejm-modal');
  var player = modal.querySelector('#ejm-modal-player');
  var mTitle = modal.querySelector('#ejm-modal-title');

  // The layout's fade-in animation leaves a transform on #main-content's children,
  // and a transformed ancestor becomes the containing block for position:fixed -
  // which would size the modal to the (very tall) page wrapper instead of the
  // viewport. Reparenting to <body> puts it outside that transform for good.
  document.body.appendChild(modal);

  function openVideo(src, title) {
    mTitle.textContent = title;
    player.src = src;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    player.play().catch(function () { /* user can press play */ });
  }
  function closeVideo() {
    player.pause();
    player.removeAttribute('src');
    player.load();
    modal.hidden = true;
    document.body.style.overflow = '';
  }
  root.addEventListener('click', function (e) {
    var w = e.target.closest ? e.target.closest('.ejm-watch') : null;
    if (!w) return;
    e.preventDefault();
    e.stopPropagation();   // the Watch button sits inside a <label>; don't toggle the tick
    openVideo(w.getAttribute('data-video'), w.getAttribute('data-title'));
  });
  // modal now lives on <body>, so it needs its own handler
  modal.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-close]')) closeVideo();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeVideo(); });

  render();
})();
</script>
