# =============================================================================
# eJukebox entity facts - the single source of truth for structured data (JSON-LD)
# =============================================================================
# _includes/schema.html renders this into an Organization node with a stable @id
# (https://ejukebox.com.au/#organization) that EVERY page references. That shared
# @id is what makes search engines and AI assistants treat the site as one entity
# with many pages, rather than 40 unrelated documents.
#
# Keep this file, llms.txt and the on-page copy stating identical facts. When the
# three agree, an answer engine has no competing version to pick from.
#
# NAP (name/address/phone) below is authoritative. If it changes here it must also
# change in llms.txt, contact.html and the footer.
# -----------------------------------------------------------------------------

brand: eJukebox
legal_name: Musicbot Pty Ltd
alternate_names:
  - Musicbot
  - eJukebox Australia
  - eJukebox Music
abn: "44 163 918 054"
founded: "2013"          # Musicbot Pty Ltd incorporated. Players live in venues since 2018.
slogan: Licensed music your staff steer and your customers request.

# Short entity description. Deliberately mirrors the opening of llms.txt.
description: >-
  eJukebox is an Australian owned commercial background music and interactive
  jukebox service for pubs, bars, hotels, clubs, cafes, restaurants, gyms, retail
  shops, salons, function centres and medical waiting rooms across Australia.
  Venues stream professionally curated, human programmed, fully licensed music
  channels with no ads, no talk and no explicit lyrics. Staff control the room
  from a phone and patrons request songs from theirs by scanning a QR code.

# ---- Contact / NAP ----------------------------------------------------------
telephone: "+61 2 9802 5552"
email: info@ejukebox.com.au
address:
  street: 218 Buffalo Road
  locality: Ryde
  region: NSW
  postcode: "2112"
  country: AU

# ---- Profiles that identify this organisation (sameAs) -----------------------
# Only URLs that unambiguously ARE eJukebox / Musicbot. Facebook and X come from
# site.social in _config.yml; everything else goes here. Add LinkedIn, Instagram,
# YouTube and the Google Business Profile here as soon as they exist.
same_as:
  - https://apps.apple.com/au/developer/ejukebox/id978645791        # App Store developer page
  - https://play.google.com/store/apps/developer?id=Musicbot        # Google Play developer page
  - https://abr.business.gov.au/ABN/View?abn=44163918054            # ABN Lookup, the public register
acn: "163 918 054"       # the last nine digits of the ABN, as for every Australian company

# ---- Where the service is offered -------------------------------------------
# areaServed. Rendered as Country > State > City/region, each place pinned to its
# state with an @id, so "Newcastle" is never mistaken for the one in England.
# Service nodes on every page point at the Country (#area-au); the full list lives
# on the Organization. eJukebox runs over an ordinary internet connection, so the
# service genuinely covers all of it - metro, regional and remote. Regional names
# are deliberate: they evidence national reach rather than capitals-only.
# Several are towns where eJukebox venues already trade (Central Coast, Wheatbelt,
# Mackay, Kalgoorlie, Bundaberg).
area_served:
  states:
    - name: New South Wales
      code: NSW
      cities: [Sydney, Newcastle, Wollongong, Coffs Harbour, Port Macquarie, Tamworth, Wagga Wagga, Albury, Orange, Dubbo, Bathurst, Lismore, Byron Bay]
      regions: [Sydney CBD, Central Coast, Hunter Valley]
    - name: Victoria
      code: VIC
      cities: [Melbourne, Geelong, Ballarat, Bendigo, Shepparton, Mildura, Warrnambool, Traralgon, Wodonga]
    - name: Queensland
      code: QLD
      cities: [Brisbane, Gold Coast, Sunshine Coast, Townsville, Cairns, Toowoomba, Mackay, Rockhampton, Bundaberg, Hervey Bay, Gladstone, Mount Isa]
    - name: Western Australia
      code: WA
      cities: [Perth, Mandurah, Bunbury, Busselton, Geraldton, Kalgoorlie, Albany, Broome, Karratha, Port Hedland]
      regions: [Wheatbelt]
    - name: South Australia
      code: SA
      cities: [Adelaide, Mount Gambier, Whyalla, Port Augusta, Port Lincoln, Murray Bridge]
      regions: [Barossa Valley]
    - name: Tasmania
      code: TAS
      cities: [Hobart, Launceston, Devonport, Burnie]
    - name: Australian Capital Territory
      code: ACT
      cities: [Canberra]
    - name: Northern Territory
      code: NT
      cities: [Darwin, Palmerston, Alice Springs, Katherine]

