# =============================================================================
# eJukebox a-la-carte pricing - single source of truth for /pricing and /wholesale
# =============================================================================
# Both pages render from this file via _includes/pricing-menu.html, so retail and
# wholesale can never drift apart. Change a price here and both pages update.
#
# retail = what an end customer pays buying direct (ex GST)
# whl    = what a reseller pays us (~72% of retail); they keep the ~28% margin
#
# Figures from: eJukebox-Pricing-Licensing-Strategy-Deck.pptx (working draft v3,
# 15 July 2026), slides 34-36. The deck lists these as Marc's recommended locks.
# -----------------------------------------------------------------------------

video_base: https://ejukebox01.blob.core.windows.net/websiteblobs/features/
# Overview video for the base product (full URL - it lives in a different blob folder).
base_video: https://ejukebox01.blob.core.windows.net/websiteblobs/base/eJukebox-Main-Deck.mp4

tiers:
  # Solo is a STREAMING-ONLY product: a private URL, no on-site player, no upfront
  # hardware, single zone, and explicitly NO song requests or interaction layer.
  # It must never be described as sharing Core's feature set.
  - id: solo
    name: Solo
    tagline: Small shop, salon or cafe
    retail: 49
    whl: 35
    zones_included: 1
    zones_fixed: true
    hardware: none
    blurb: Streaming only. One curated channel for a single area, like an ad-free radio station for your business. No song requests.
    points:
      - Streams over the internet - nothing to install, no hardware to buy
      - One curated channel, one area
      - Ad-free, licensed, family-friendly, volume-levelled
      - No song requests and no interaction features
    allows_addons: false
  - id: core
    name: Core
    tagline: The hospitality base
    retail: 169
    whl: 122
    recommended: true
    zones_included: 2
    hardware: player
    blurb: The curated, licensed music your venue runs on, plus the interaction layer. Bolt on exactly what you want.
    points:
      - 2 zones included
      - Song Requests and the full interaction layer
      - On-site player, keeps playing offline (one-off hardware cost)
      - We collect and remit your OneMusic licence
    allows_addons: true
  - id: complete
    name: Complete
    tagline: Get the lot
    retail: 299
    whl: 215
    zones_included: 2
    hardware: player
    blurb: Core plus every software add-on in one price. Cheaper than ticking them all individually.
    points:
      - Everything in Core
      - Every software add-on included
      - Voice suite, dedications, Spotify, both screens, functions
      - Extra zones and hardware still priced separately
    allows_addons: true
    includes_all_addons: true

# ---- What each tier includes at no extra cost --------------------------------
# `tiers` lists which bases actually include the item. Solo is streaming only, so
# it shares ONLY the music-quality items - never the request/interaction ones.
# The page filters this list by the selected tier; nothing here is hard-coded.
included:
  # -- the music itself: true of every tier
  - id: curated-channels
    name: Human-curated channels
    category: Music
    tiers: [solo, core, complete]
    desc: Every channel is hand-built and refreshed by professional Australian music directors, never guessed at by an algorithm. Hits, Smooth, Rock and Country.
    video:
  - id: licensed-clean
    name: Licensed and family-friendly
    category: Compliance
    tiers: [solo, core, complete]
    desc: Fully licensed for public play, and free of swearing and explicit lyrics. Playing eJukebox is what makes you a venue on a commercial background music supplier, which is what changes your OneMusic position - see the licensing section below.
    video:
  - id: broadcast-quality
    name: Ad-free, broadcast-quality sound
    category: Music
    tiers: [solo, core, complete]
    desc: Professionally processed for consistent volume, so nothing jumps between songs. No ads and no talk over the music - it simply plays.
    video:

  # -- Solo only
  - id: stream-url
    name: Streams to a device you already own
    category: Delivery
    tiers: [solo]
    desc: Solo is a streaming service, not an installation. You get your own private URL that plays through any browser, computer, tablet, phone, Sonos or streamer you already have. Nothing to install, no player at the venue, and no upfront hardware cost.
    video:
  - id: single-area
    name: One channel, one area
    category: Capacity
    tiers: [solo]
    desc: Solo covers a single area with one channel at a time. For different music in different areas, or for anything your customers or staff can interact with, you need Core.
    video:

  # -- Core and Complete only
  - id: onsite-player
    name: On-site player, keeps playing offline
    category: Delivery
    tiers: [core, complete]
    desc: A compact solid-state player is installed at your venue and caches your music, so it keeps playing even if the internet drops out. This is the one-off hardware cost noted further down, and it is what makes the interactive features possible.
    video:
  - id: song-requests
    name: Song Requests
    category: Requests
    tiers: [core, complete]
    desc: Customers request from their own phone with no app. Staff keep full control - open the whole library or lock it to the current channel, and pause requests anytime.
    video: eJukebox-Feature-Song-Requests.mp4
  - id: song-previews
    name: Song Previews
    category: Discovery
    tiers: [core, complete]
    desc: Tap any track for an official 30-second preview before requesting it. Try before you queue.
    video:
  - id: playing-across-country
    name: Playing Across the Country
    category: Discovery
    tiers: [core, complete]
    desc: A live grid of what venues nationwide are playing right now, filtered to your venue's style. Tap any track to request it.
    video:
  - id: next-songs
    name: Next Songs Reordering
    category: Control
    tiers: [core, complete]
    desc: See what's coming up and drag it into the order you want, live from the admin panel. Takes effect on the player straight away.
    video: eJukebox-Feature-Next-Songs-Reordering.mp4
  - id: record-voice
    name: Record Voice Announcement
    category: Voice
    tiers: [core, complete]
    desc: Record your own voice on any phone; it plays neatly between songs, never over the music. Profanity-moderated.
    video: eJukebox-Feature-Record-Voice-Announcement.mp4
  - id: two-zones
    name: 2 zones included
    category: Capacity
    tiers: [core, complete]
    desc: Play different music in different areas - the bar, the bistro, the beer garden. Two zones come standard where most providers charge for every single one.
    video:
  - id: onemusic-admin
    name: OneMusic administration
    category: Licensing
    tiers: [core, complete]
    desc: We can collect your OneMusic licence fee on your behalf and remit it straight to OneMusic, so the paperwork stops being your problem. The licence fee itself is separate - see the licensing section below.
    video:

# ---- Paid add-ons (on top of Core) -----------------------------------------
addons:
  - id: spotify
    name: Spotify Integration
    category: Music
    retail: 29
    whl: 21
    desc: Guests sign in with Spotify and pick one of their own playlists; every track is fuzzy-matched to your library so they can request it in a tap. Staff can load a whole curated playlist into the queue in one move.
    video: eJukebox-Feature-Spotify-Integration.mp4
  - id: tts
    name: Type a Message
    category: Voice
    retail: 19
    whl: 14
    desc: Type a line and a warm, broadcast-quality voice reads it across the room between songs. No microphone, no staff member put on the spot.
    video: eJukebox-Feature-Type-A-Message.mp4
    bundle: voice-suite
  - id: scheduled
    name: Scheduled Announcements
    category: Automation
    retail: 25
    whl: 18
    desc: Book a typed or recorded message to play itself - daily, on chosen nights, or once. Happy hour, last drinks, trivia night, on flawless autopilot.
    video: eJukebox-Feature-Scheduled-Announcements.mp4
    bundle: voice-suite
  - id: livemic
    name: Live Microphone
    category: Live
    retail: 29
    whl: 21
    desc: Any staff phone becomes a professional PA mic in seconds. The music ducks the instant you speak and swells back when you stop.
    video: eJukebox-Feature-Live-Microphone.mp4
    bundle: voice-suite
  - id: livemic-monitor
    name: Live Mic Monitor
    category: Live
    retail: 15
    whl: 11
    desc: The venue's program audio - with your own voice stripped out - streamed back to your headphones, so you can talk up to the vocal like a radio DJ.
    video: eJukebox-Feature-Live-Mic-Monitor.mp4
    requires: livemic
    requires_label: Requires Live Microphone
    bundle: voice-suite
  - id: dedications
    name: Voice Dedications
    category: Interaction
    retail: 25
    whl: 18
    desc: Customers record an 8-second shout-out that plays right before their song. Transcribed and profanity-scanned in real time, so it's safe to hand to a full room.
    video: eJukebox-Feature-Voice-Dedications.mp4
  - id: photo-screen
    name: Photo Slideshow Display
    category: Display
    retail: 25
    whl: 18
    desc: When requests go quiet your screen blooms into a branded slideshow - event nights, specials, your logo. A 24/7 billboard you already own.
    video: eJukebox-Feature-Photo-Display.mp4
    hardware: Needs a screen (one-off hardware)
  - id: request-screen
    name: Interactive Request Screen
    category: Requests
    retail: 39
    whl: 28
    desc: A wall-mounted touchscreen request booth. Customers walk up, browse the library and pick a song - no phone needed. Same request engine, big-screen sized.
    video: eJukebox-Feature-Interactive-Request-Screen.mp4
    hardware: Needs a touchscreen (one-off hardware)
  - id: functions
    name: Functions & Events
    category: Events
    retail: 19
    whl: 14
    desc: Give a function host their own night-only controls - skip, cue the right track, and stop cleanly for the speeches - without pulling staff off the floor.
    video: eJukebox-Feature-Functions-and-Events.mp4

# ---- Bundles ---------------------------------------------------------------
bundles:
  - id: voice-suite
    name: Voice Suite
    retail: 69
    whl: 50
    members: [tts, scheduled, livemic, livemic-monitor]
    desc: Type a Message + Scheduled Announcements + Live Microphone + Live Mic Monitor, bundled.

# ---- Zones -----------------------------------------------------------------
# `included` is the Core/Complete default; Solo overrides it to 1 via zones_included.
#
# IMPORTANT: the on-site player fitted for the 2 included zones already drives up to
# `max` zones. Zones 3 and 4 therefore cost NOTHING in extra hardware - they are a
# monthly charge only. There is no such thing as "extra-zone hardware".
#
# Beyond `max` zones a second player would be needed, so the stepper stops at 4 and
# points people at us. The deck's "5+ zones flat $120 cap" is parked until Marc
# decides how a 5th zone is delivered and priced.
zones:
  included: 2
  max: 4
  extra_retail: 39
  extra_whl: 28
  note: Two zones come standard, and the player we fit already drives up to four - so zones three and four add no hardware cost at all, just the monthly charge. Each extra zone still costs less than a single Soundtrack zone.
